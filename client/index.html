<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Groceror — From Grocer to Sorceror</title>
    <meta name="description" content="Groceror is the all-in-one platform for grocers and shoppers — manage inventory, browse fresh products, and check out in seconds." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      (function () {
        var stored = localStorage.getItem("groceror_theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
